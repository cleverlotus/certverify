<!DOCTYPE html>
<html>
<head>
    <title>Certificate Verification</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>

    <style>
        body{
            font-family: Arial, sans-serif;
            max-width:800px;
            margin:auto;
            padding:40px;
            text-align:center;
        }

        .valid{
            color:green;
            font-size:28px;
            font-weight:bold;
        }

        .invalid{
            color:red;
            font-size:28px;
            font-weight:bold;
        }

        .card{
            border:1px solid #ddd;
            padding:20px;
            border-radius:10px;
            margin-top:20px;
        }
    </style>
</head>

<body>

<h1>Blockchain Certificate Verification</h1>

<div class="card">

<p id="status">Loading...</p>

<p>
Certificate ID:
<br>
<span id="certificateId"></span>
</p>

<p>
Certificate Hash:
<br>
<span id="certificateHash"></span>
</p>

<p>
Issuer:
<br>
<span id="issuer"></span>
</p>

</div>

<script>

const CONTRACT_ADDRESS = "PASTE_YOUR_CONTRACT_ADDRESS";

const ABI = [
{
"inputs":[{"internalType":"bytes32","name":"certificateId","type":"bytes32"}],
"name":"verifyCertificate",
"outputs":[
{"internalType":"bool","name":"exists","type":"bool"},
{"internalType":"bool","name":"valid","type":"bool"},
{"internalType":"bytes32","name":"certificateHash","type":"bytes32"},
{"internalType":"address","name":"issuer","type":"address"}
],
"stateMutability":"view",
"type":"function"
}
];

async function verify() {

    const id =
        new URLSearchParams(window.location.search)
        .get("id");

    document.getElementById("certificateId").innerText = id;

    const provider =
        new ethers.JsonRpcProvider(
            "https://rpc.sepolia.org"
        );

    const contract =
        new ethers.Contract(
            CONTRACT_ADDRESS,
            ABI,
            provider
        );

    try{

        const result =
            await contract.verifyCertificate(id);

        const exists = result[0];
        const valid = result[1];
        const hash = result[2];
        const issuer = result[3];

        document.getElementById("certificateHash").innerText = hash;
        document.getElementById("issuer").innerText = issuer;

        if(exists && valid){

            document.getElementById("status").innerHTML =
                '<span class="valid">✅ VALID CERTIFICATE</span>';

        } else {

            document.getElementById("status").innerHTML =
                '<span class="invalid">❌ REVOKED / INVALID</span>';

        }

    } catch(err){

        document.getElementById("status").innerHTML =
            '<span class="invalid">Certificate Not Found</span>';

        console.error(err);
    }

}

verify();

</script>

</body>
</html>
