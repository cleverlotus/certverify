<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Certificate Verification</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:40px;
    background:#f4f6f9;
}

.card{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.valid{
    color:green;
    font-size:28px;
    font-weight:bold;
}

.invalid{
    color:red;
    font-size:28px;
    font-weight:bold;
}

label{
    font-weight:bold;
}

.value{
    word-break:break-all;
}
</style>
</head>

<body>

<div class="card">

<h1>Certificate Verification Portal</h1>

<p id="status">Loading...</p>

<hr>

<p>
<label>Certificate ID:</label>
<br>
<span id="certificateId" class="value"></span>
</p>

<p>
<label>Certificate Hash:</label>
<br>
<span id="certificateHash" class="value"></span>
</p>

<p>
<label>Issuer:</label>
<br>
<span id="issuer" class="value"></span>
</p>

<p>
<label>Issued At:</label>
<br>
<span id="issuedAt"></span>
</p>

</div>

<script>

const CONTRACT_ADDRESS =
"0xd9145CCE52D386f254917e481eB44e9943F39138";

const ABI = [
{
"inputs":[
{"internalType":"bytes32","name":"certificateId","type":"bytes32"}
],
"name":"verifyCertificate",
"outputs":[
{"internalType":"bool","name":"exists","type":"bool"},
{"internalType":"bool","name":"valid","type":"bool"},
{"internalType":"bytes32","name":"certificateHash","type":"bytes32"},
{"internalType":"address","name":"issuer","type":"address"},
{"internalType":"uint256","name":"issuedAt","type":"uint256"}
],
"stateMutability":"view",
"type":"function"
}
];

async function loadCertificate(){

const params =
new URLSearchParams(window.location.search);

const id = params.get("id");

if(!id){
document.getElementById("status").innerHTML =
"Provide ?id=CERTIFICATE_ID";
return;
}

document.getElementById("certificateId").innerText = id;

try{

const provider =
new ethers.JsonRpcProvider(
"https://ethereum-sepolia-rpc.publicnode.com"
);

const contract =
new ethers.Contract(
CONTRACT_ADDRESS,
ABI,
provider
);

const result =
await contract.verifyCertificate(id);

const exists = result[0];
const valid = result[1];
const hash = result[2];
const issuer = result[3];
const issuedAt = result[4];

document.getElementById("certificateHash").innerText =
hash;

document.getElementById("issuer").innerText =
issuer;

document.getElementById("issuedAt").innerText =
new Date(Number(issuedAt) * 1000).toLocaleString();

if(exists && valid){

document.getElementById("status").innerHTML =
'<span class="valid">✅ VALID CERTIFICATE</span>';

}else{

document.getElementById("status").innerHTML =
'<span class="invalid">❌ REVOKED OR INVALID CERTIFICATE</span>';

}

}catch(error){

console.error(error);

document.getElementById("status").innerHTML =
'<span class="invalid">Certificate Not Found</span>';

}

}

loadCertificate();

</script>

</body>
</html>
